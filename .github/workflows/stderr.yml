name: stderr-backpressure

on:
    workflow_dispatch:
    push:
        paths:
            - src/stderr-backpressure.mjs
            - .github/workflows/stderr.yml

jobs:
    measure:
        name: ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: 24

            # stderr is a pipe read by the runner, which is what CI and `| tee` look like.
            - name: stderr is a pipe
              run: node src/stderr-backpressure.mjs

            # A real tty on stderr, borrowed from script(1). There is no equivalent here for Windows.
            - name: stderr is a tty
              if: runner.os == 'Linux'
              run: script -q -e -c "node src/stderr-backpressure.mjs" /dev/null
            - name: stderr is a tty
              if: runner.os == 'macOS'
              run: script -q /dev/null node src/stderr-backpressure.mjs
